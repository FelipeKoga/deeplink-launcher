appId: dev.koga.deeplinklauncher.android
name: "Edit a deeplink name and description"
---
- runFlow: ../subflows/start_clean.yaml
- runFlow:
    file: ../subflows/create_deeplink.yaml
    env:
      LINK: "https://www.example.com"
- tapOn: "https://www.example.com"
- tapOn: "More actions"
- tapOn: "Edit"
- assertVisible: "Folder"
- tapOn: "Name"
- inputText: "My Site"
- tapOn: "Description"
- inputText: "Site used by the tests"
- hideKeyboard
- tapOn: "Back"
- assertVisible: "More actions"
- assertVisible: "My Site"
- back
- assertVisible: "My Site"
