name: CLI Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-build
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the CLI version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cliApp/build.gradle.kts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: deeplink-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          set-java-home: 'false'

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build the native binary
        run: ./gradlew :cliApp:test :cliApp:nativeImage

      - name: Smoke test the binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          binary=cliApp/build/native/deeplink
          "$binary" --version | grep -F "$VERSION"
          "$binary" parse "myapp://product/42?ref=email" --json | grep -F '"query": "ref=email"'

      - name: Package
        run: tar -czf "$ARCHIVE" -C cliApp/build/native deeplink

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  jvm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Package the JVM build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew :cliApp:distTar
          cp "cliApp/build/distributions/deeplink-$VERSION.tar.gz" "deeplink-$VERSION-jvm.tar.gz"

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: jvm
          path: deeplink-${{ needs.version.outputs.version }}-jvm.tar.gz
          if-no-files-found: error
