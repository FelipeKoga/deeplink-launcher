name: Release

on:
  workflow_dispatch:
    inputs:
      tagname:
        description: 'Version name'
        required: true
        default: 'v1.0.0'
        type: string
      play-track:
        description: 'Google Play track to upload the AAB to'
        required: true
        default: 'internal'
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production
      play-rollout:
        description: 'Google Play rollout fraction, 0 < x <= 1 (below 1 starts a staged rollout)'
        required: true
        default: '1'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ github.event.inputs.tagname }}',
              sha: context.sha
            })

  baseline-profile:
    uses: ./.github/workflows/baseline-profile.yml
    secrets: inherit
    with:
      open-pr: true

  build-apk:
    needs: [create-tag, baseline-profile]
    if: ${{ !cancelled() && needs.create-tag.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE_NAME: release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-
            ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Update dependencies
        run: ./gradlew dependencies

      - name: Create release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYSTORE_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Without it the build would sign with the committed testing keystore."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "androidApp/$KEYSTORE_FILE_NAME"
          keytool -list -keystore "androidApp/$KEYSTORE_FILE_NAME" -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" > /dev/null

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Download baseline profiles
        if: ${{ needs.baseline-profile.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: baseline-profiles
          path: androidApp/src/release/generated/baselineProfiles

      - name: Warn about committed baseline profiles
        if: ${{ needs.baseline-profile.result != 'success' }}
        run: echo "::warning::Baseline profile generation failed; the APK uses the committed profiles."

      - name: Build APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Check if APK exists
        run: |
          if [ -f ./androidApp/build/outputs/apk/release/*.apk ]; then
          echo "APK exists."
          else
          echo "APK does not exist." >&2
          exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            ./androidApp/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          if-no-files-found: error
          path: |
            ./androidApp/build/outputs/bundle/release/*.aab
            ./androidApp/build/outputs/mapping/release/mapping.txt

  publish-google-play:
    needs: build-apk
    if: ${{ inputs.play-track != 'none' }}
    runs-on: ubuntu-latest
    concurrency:
      group: google-play
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: play

      - name: Upload to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.play-track }}
          PLAY_ROLLOUT: ${{ inputs.play-rollout }}
        run: >
          bundle exec fastlane android deploy
          track:"$PLAY_TRACK"
          rollout:"$PLAY_ROLLOUT"
          aab:"$(ls play/bundle/release/*.aab)"
          mapping:play/mapping/release/mapping.txt

  build-deb:
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build DEB
        run: ./gradlew :desktopApp:packageReleaseDeb

      - name: Upload DEB
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ubuntu-deb
          path: |
            ./desktopApp/build/compose/binaries/main-release/deb

  build-exe:
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Grant execute permission for gradlew
        run: ./gradlew.bat

      - name: Build EXE
        run: ./gradlew.bat :desktopApp:packageReleaseExe

      - name: Upload EXE
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-exe
          path: |
            ./desktopApp/build/compose/binaries/main-release/exe/*.exe

  build-dmg:
    needs: create-tag
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-dmg
          path: |
            ./desktopApp/build/compose/binaries/main-release/dmg/*.dmg

  create-release:
    needs: [build-apk, build-deb, build-exe, build-dmg]
    runs-on: ubuntu-latest
    env:
      DOWNLOADS_PATH: ./downloaded-artifacts

    steps:
      - name: Download desktop windows exe artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-exe
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download desktop ubuntu deb artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-ubuntu-deb
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download desktop macos dmg artifact
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-dmg
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Test artifact download
        run: ls -R

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tagname }}
          release_name: ${{ github.event.inputs.tagname }}
          draft: false
          prerelease: false

      - name: Upload artifacts to GitHub Release
        id: upload-release-assets
        uses: dwenegar/upload-release-assets@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
          assets_path: ${{ env.DOWNLOADS_PATH }}/*/