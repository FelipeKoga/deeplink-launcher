name: Release

on:
  workflow_dispatch:
    inputs:
      tagname:
        description: 'Version name'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ github.event.inputs.tagname }}',
              sha: context.sha
            })

  build-apk:
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-
            ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Update dependencies
        run: ./gradlew dependencies

      - name: Set up release keystore
        uses: ./.github/actions/release-keystore-action
        with:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Check if APK exists
        run: |
          if [ -f ./androidApp/build/outputs/apk/release/*.apk ]; then
          echo "APK exists."
          else
          echo "APK does not exist." >&2
          exit 1
          fi

      - name: Print APK signing certificate
        run: |
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs ./androidApp/build/outputs/apk/release/*.apk | grep -E 'DN|SHA-256'

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: |
            ./androidApp/build/outputs/apk/release/*.apk

  build-deb:
    needs: create-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build DEB
        run: ./gradlew :desktopApp:packageReleaseDeb

      - name: Upload DEB
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-ubuntu-deb
          path: |
            ./desktopApp/build/compose/binaries/main-release/deb

  build-exe:
    needs: create-tag
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Grant execute permission for gradlew
        run: ./gradlew.bat

      - name: Build EXE
        run: ./gradlew.bat :desktopApp:packageReleaseExe

      - name: Upload EXE
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-exe
          path: |
            ./desktopApp/build/compose/binaries/main-release/exe/*.exe

  build-dmg:
    needs: create-tag
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-macos-dmg
          path: |
            ./desktopApp/build/compose/binaries/main-release/dmg/*.dmg

  create-release:
    needs: [build-apk, build-deb, build-exe, build-dmg]
    runs-on: ubuntu-latest
    env:
      DOWNLOADS_PATH: ./downloaded-artifacts

    steps:
      - name: Download desktop windows exe artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-windows-exe
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download desktop ubuntu deb artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-ubuntu-deb
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download desktop macos dmg artifact
        uses: actions/download-artifact@v7
        with:
          name: desktop-macos-dmg
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Download android APK artifact
        uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: ${{ env.DOWNLOADS_PATH }}

      - name: Test artifact download
        run: ls -R

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tagname }}
          release_name: ${{ github.event.inputs.tagname }}
          draft: false
          prerelease: false

      - name: Upload artifacts to GitHub Release
        id: upload-release-assets
        uses: dwenegar/upload-release-assets@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
          assets_path: ${{ env.DOWNLOADS_PATH }}/*/