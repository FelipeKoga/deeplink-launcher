name: Baseline Profile

on:
  workflow_call:
    inputs:
      open-pr:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      open-pr:
        description: 'Open a PR with the regenerated profiles'
        type: boolean
        default: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate baseline profile
        run: >
          ./gradlew :androidApp:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace

      - name: Check generated profiles
        run: |
          for f in baseline-prof startup-prof; do
            test -s "androidApp/src/release/generated/baselineProfiles/$f.txt"
          done
          git diff --stat -- androidApp/src/release/generated/baselineProfiles

      - name: Upload baseline profiles
        uses: actions/upload-artifact@v6
        with:
          name: baseline-profiles
          path: androidApp/src/release/generated/baselineProfiles/*.txt
          if-no-files-found: error

      - name: Open PR with regenerated profiles
        if: ${{ inputs.open-pr }}
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: androidApp/src/release/generated/baselineProfiles/*.txt
          branch: chore/refresh-baseline-profiles
          base: main
          delete-branch: true
          commit-message: 'chore(baseline-profile): regenerate from ${{ github.ref_name }}@${{ github.sha }}'
          title: 'chore(baseline-profile): regenerate baseline profiles'
          body: |
            Regenerated by the Baseline Profile workflow (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) from `${{ github.ref_name }}` at `${{ github.sha }}`.

            The same files were already used to build the release APK of that run, when it was a release.
