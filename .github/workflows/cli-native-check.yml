name: CLI Native Check

on:
  push:
    branches: [ "ci/cli-release" ]

jobs:
  native:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-arm64
            runner: macos-latest
          - target: macos-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: deeplink-0.1.0-${{ matrix.target }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          set-java-home: 'false'

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Build the native binary
        run: ./gradlew :cliApp:test :cliApp:nativeImage

      - name: Smoke test the binary
        env:
          VERSION: 0.1.0
        run: |
          binary=cliApp/build/native/deeplink
          "$binary" --version | grep -F "$VERSION"
          "$binary" parse "myapp://product/42?ref=email" --json | grep -F '"query": "ref=email"'

      - name: Package
        run: tar -czf "$ARCHIVE" -C cliApp/build/native deeplink

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

