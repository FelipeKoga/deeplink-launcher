name: CLI Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cli-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'zulu'
          cache: gradle

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Read the CLI version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cliApp/build.gradle.kts)
          test -n "$version"
          if git ls-remote --exit-code --tags origin "refs/tags/cli-v$version" > /dev/null; then
            echo "::error::cli-v$version already exists. Bump version in cliApp/build.gradle.kts first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and package
        run: ./gradlew :cliApp:test :cliApp:distTar

      - name: Smoke test the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir smoke
          tar xzf "cliApp/build/distributions/deeplink-$VERSION.tar.gz" -C smoke
          "smoke/deeplink-$VERSION/bin/deeplink" --version | grep -F "$VERSION"
          "smoke/deeplink-$VERSION/bin/deeplink" parse "myapp://product/42?ref=email"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "cli-v$VERSION" "cliApp/build/distributions/deeplink-$VERSION.tar.gz"
          --target "$GITHUB_SHA"
          --title "deeplink CLI $VERSION"
          --notes "Install with \`brew install felipekoga/tap/deeplink\`, or download the archive and run \`bin/deeplink\` (needs Java 17+). See docs/CLI.md."
          --latest=false

      - name: Write the Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha=$(sha256sum "cliApp/build/distributions/deeplink-$VERSION.tar.gz" | cut -d' ' -f1)
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$sha/g" cliApp/homebrew/deeplink.rb.template > deeplink.rb
          {
            echo "### Homebrew formula for deeplink $VERSION"
            echo
            echo "Commit this as \`Formula/deeplink.rb\` in \`FelipeKoga/homebrew-tap\`:"
            echo
            echo '```ruby'
            cat deeplink.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Homebrew formula
        uses: actions/upload-artifact@v6
        with:
          name: homebrew-formula
          path: deeplink.rb
