name: Screenshot Baseline

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: screenshot-baseline
  cancel-in-progress: true

jobs:
  record-screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >
            ${{ runner.os }}-gradle-
            ${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Robolectric runtime
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-robolectric-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > androidApp/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create Environment File
        uses: ./.github/actions/create-env-action
        with:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

      - name: Record screenshots
        run: ./gradlew recordRoborazziDebug

      - name: Upload baseline
        uses: actions/upload-artifact@v6
        with:
          name: screenshot-baseline
          path: '**/build/outputs/roborazzi/*.png'
          retention-days: 90
          if-no-files-found: error
